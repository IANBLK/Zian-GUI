name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle and wrapper validation
        uses: gradle/actions/setup-gradle@v5
      - name: Compile
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload playable JAR
        uses: actions/upload-artifact@v6
        with:
          name: zian-gui-${{ github.sha }}
          path: build/libs/zian-gui-*.jar
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v7
        with:
          name: zian-gui-${{ github.sha }}
          path: release
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/*.jar --title "Zian GUI $RELEASE_TAG" --generate-notes "${options[@]}"
