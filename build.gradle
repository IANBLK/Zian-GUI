plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version
base { archivesName = 'zian-gui' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    testImplementation sourceSets.main.output
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }

tasks.named('processResources', ProcessResources) {
    inputs.properties([mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                       mod_license: mod_license, neo_version: neo_version])
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
               mod_license: mod_license, neo_version: neo_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar) {
    from('LICENSE') { into 'META-INF' }
    manifest {
        attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
    }
}
